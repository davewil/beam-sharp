# CI for the beam-sharp compiler.
#
# There was none before 2026-08-14. That is the background to what this file
# does and does not run: the repo already had three verification scripts, and
# on the day CI was added TWO OF THEM FAILED ON MASTER. Nothing was watching, so
# nothing said. The gates below are the ones that pass; the ones that do not are
# named at the bottom rather than quietly left out, because an unlisted broken
# check is how this happened in the first place.

name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # THESE TWO NEED NO COMPILER, SO THEY RUN FIRST AND FAIL FAST.
      #
      # `check-map.sh` existed since the map was split on 2026-08-15 and was
      # NEVER WIRED IN — it ran only when somebody remembered, which is the
      # same failure this whole file was written about. On the day it was
      # finally added here it was already catching two real defects per run.
      #
      # `check-surface.sh` is new. It closes the one gap `check-language.sh`
      # cannot reach: that gate proves LANGUAGE.md matches the COMPILER, and
      # unbuilt syntax does not compile, so a `not-yet` block holding the
      # decided syntax and one holding SUPERSEDED syntax are indistinguishable
      # to it. Ticket 44 changed the conjunction and left a stale block with
      # every gate green; ticket 42 added a construct the doc never mentioned.
      # Since a `not-yet` block IS the clean-room handoff's spec, the place the
      # other gates cannot see is the place the handoff most depends on.
      # THE FOUR GATES BELOW CHECK THE GATES, and they run first because a
      # suite that cannot be trusted makes every result after it unreadable.
      # Added 2026-08-18 from an audit of the last twenty commits for
      # self-inflicted defects — the classes are not hypothetical, each one is
      # named in a commit message or in a comment in this file.
      #
      # EVERY ONE OF THEM RUNS ITS OWN --self-test FIRST. A gate is believed
      # here only if it has been shown to fail on the defect it names and to
      # pass on the correct form beside it; `spec-check.sh` has held that line
      # since ticket 15 lost a session to a harness that supplied the protection
      # it was measuring, and these four inherit it rather than reinvent it.
      #
      # The self-test is a SEPARATE step on purpose. Folded into the gate it
      # would be one exit code covering two questions, and "the suite is green"
      # would stop distinguishing "no violations" from "the check still works".
      - name: The gate-gates prove they can fail
        run: |
          ./bin/check-gates-wired.sh --self-test
          ./bin/check-cwd-independence.sh --self-test
          ./bin/check-shell.sh --self-test
          ./compiler/bin/check-no-silent-skip.sh --self-test
          ./bin/check-map.sh --self-test
          ./bin/check-surface.sh --self-test
          ./bin/check-links.sh --self-test
          ./compiler/bin/extract-exemplars.sh --self-test

      # `check-map.sh` was written on 2026-08-15 and NEVER WIRED IN; it ran only
      # when somebody remembered. `editor/bin/` held two more this file had
      # never mentioned, and they collected five features of drift. Prose at the
      # foot of this file already forbade both. Prose cannot check itself.
      - name: Every gate on disk is wired into this file
        run: ./bin/check-gates-wired.sh

      # A gate that cannot find its files reports NO VIOLATIONS, which is the
      # same output as success. A README change committed from the wrong
      # directory once meant two gates did not run and nothing said so. This
      # runs each cheap gate from two directories and requires the same verdict
      # — a run rather than a grep, because the first draft grepped for
      # `BASH_SOURCE` and falsely accused a script that anchors with `$0`.
      - name: Gates give the same verdict from any directory
        run: ./bin/check-cwd-independence.sh

      # Every gate here is shell, so a quoting bug in one is a bug in the thing
      # that decides whether everything else is correct — and this repo's own
      # record is exactly that: check-links.sh reported 6 dead paths where there
      # were 20, then misnumbered its own output. shellcheck at `info`, which is
      # where SC2086 lives; `warning` looked tidier and could not see the class.
      - name: The gates are shellcheck-clean
        run: ./bin/check-shell.sh

      - name: The map is an index
        run: ./bin/check-map.sh

      - name: Surface decisions are traceable from LANGUAGE.md
        run: ./bin/check-surface.sh

      # `check-links.sh` closes the gap the two above still leave open. They both
      # check that a DECISION is reflected in the documents; neither checks that
      # the documents point at things that exist. Measured 2026-08-18, the
      # shipping package carried 25 citations of `examples/<name>.bs` paths that
      # had not existed since F15 made a module a DIRECTORY — in the feature
      # files, in `LANGUAGE.md`, and in the header comment of `Totals.bs` telling
      # a reader how to run it. Every gate in this repo proved the compiler was
      # right and none proved the documents were.
      #
      # It also holds `LANGUAGE.md` to its own opening rule — no ticket numbers
      # in visible prose, because the clean-room handoff gives an implementer
      # that document and no access to `wayfinder/`. The file called that rule
      # "load-bearing rather than tidy" and had 12 violations.
      - name: The package points only at things it ships
        run: ./bin/check-links.sh

      - uses: erlef/setup-beam@v1
        with:
          # Ticket 13 §4 pins the supported range at the current release and the
          # previous two majors. Only the current one is exercised here; the
          # corpus proving the full range is a debt the skeleton still owes.
          otp-version: "28"
          rebar3-version: "3"

      # THE ESCRIPT IS BUILT BEFORE THE TESTS, AND THE ORDER IS LOAD-BEARING.
      #
      # Several tests drive `bsc` as a subprocess, because a feature is done
      # when you can see it run and the CLI is what a person actually types.
      # Those tests resolve it at `_build/default/bin/bsc`, so with `eunit`
      # first they either fail on a fresh checkout or — worse — skip silently.
      #
      # Both happened. `cli_tests:built_escript_compiles_a_file_test` guarded
      # itself with `is_regular/1` and had therefore never once executed in CI,
      # and F9 then added two CLI tests without that guard, which turned the
      # blind spot into a red build. Building first is what makes either kind
      # of test mean anything here.
      - name: Build the escript
        working-directory: compiler
        run: rebar3 escriptize

      # TOUR.md quotes the corpus and pastes what the compiler printed, and
      # `check-language.sh` can reach neither. That gate COMPILES the blocks it
      # checks, which works for LANGUAGE.md because those blocks are whole
      # programs; the tour's are excerpts — a few clauses without the signature
      # above them — so they do not compile alone. This proves instead that every
      # quoted line is verbatim in `compiler/examples/`, that every capability
      # `demonstrated_surface/0` names has a chapter, and that every replayable
      # `$ bsc …` transcript still prints what is written beside it.
      #
      # IT RUNS AFTER THE ESCRIPT BECAUSE THE THIRD PART EXECUTES THE COMPILER,
      # and it exits 2 rather than skipping when the escript is missing. Two of
      # the transcripts did not reproduce the day this was written, so the part
      # that needs a build is the part that found the defect.
      # ITS SELF-TEST IS DOWN HERE RATHER THAN WITH THE OTHER FOUR, and the
      # reason is the same one that moved the gate itself: part 3 executes the
      # compiler, so the controls cannot run before `escriptize`. It refuses
      # rather than skipping when the escript is missing, which is what keeps
      # this placement from quietly becoming a no-op if the steps are reordered.
      #
      # Four positive controls, because the gate makes four claims: an invented
      # clause, a dropped capability, a wrong pasted output, and a command in
      # the document that must NOT execute. The last is checked by its side
      # effect rather than by reading the code, since this gate did once run a
      # markdown line through `eval`.
      - name: The tour gate proves it can fail
        run: ./compiler/bin/check-tour.sh --self-test

      - name: TOUR.md quotes the corpus and replays what it pasted
        run: ./compiler/bin/check-tour.sh

      - name: Tests
        working-directory: compiler
        run: rebar3 eunit

      # A TEST THAT RETURNS `ok` FOR WORK IT DID NOT DO IS NOT A TEST.
      #
      # `cli_tests:built_escript_compiles_a_file_test` guarded itself with
      # `is_regular/1` and returned `ok` when the escript was absent — and eunit
      # ran BEFORE escriptize, so it passed without executing anything from the
      # day it was written. That one was fixed. Measured 2026-08-18, the same
      # shape was still live at 11 sites across 8 modules.
      #
      # The rule is "not silently" rather than "never skip", because the suite
      # already had two remedies and they disagree about the fix while agreeing
      # about the fault: `cli_tests` dropped its guard and throws, `repl_tests`
      # kept its guard and prints SKIPPED. Both pass. What does not is the third
      # thing — a guard that returns `ok` and says nothing.
      #
      # It runs AFTER the suite so a real failure is read before this one.
      - name: No test passes without running
        working-directory: compiler
        run: ./bin/check-no-silent-skip.sh

      # A HELPER THAT AGREES WITH THE TESTS IS NOT EVIDENCE.
      #
      # The circular-prototype class: a harness that supplies the answer it is
      # measuring. Ticket 15 lost a session to one. F14 found `check_only/1`
      # skipping the lowering, so an unlowered `e_valve` typed as `term()` and
      # "every valve assertion about clean source would have passed while
      # nothing was checked at all" — green tests, nothing checked.
      #
      # That hole is still structurally open: `check_only/1` REPRODUCES
      # `bsc:parse_string/2` rather than calling it, so the next pass added to
      # the front end re-opens it silently. This runs the helper and the
      # compiler over the same sources and requires the same DIAGNOSTIC TAG.
      #
      # Tags rather than pass/fail, and the self-test is why: the pre-F14 helper
      # rejects the valve probe too, with `return_not_declared` instead of
      # `valve_on_infallible`. Both say "no" about different things, and a
      # helper that is right by coincidence is what this gate is for. It is the
      # first consumer of F16's `--diagnostics term` outside the tests.
      #
      # It runs after eunit because it needs the test beams and the escript.
      - name: The check helper walks the compiler's path
        working-directory: compiler
        run: |
          ./bin/check-helper-agrees.sh --self-test
          ./bin/check-helper-agrees.sh

      # Every beam-sharp block in LANGUAGE.md is compiled and checked against
      # what it claims to be — untagged blocks must compile, `not-yet` blocks
      # must NOT. The second half is the one that pays: when a feature lands,
      # this names the paragraphs that now need promoting.
      #
      # It exists because the reference is written from the decisions rather
      # than from the compiler, and on 2026-08-14 it was showing two constructs
      # the language had never had.
      - name: LANGUAGE.md compiles
        working-directory: compiler
        run: ./bin/check-language.sh

      # PER DIRECTORY SINCE F15, because a directory IS the module now (ticket 13
      # §3). A per-file invocation is not merely outdated here, it is wrong: it
      # emits a `.beam` missing every other file in the module, which loads,
      # exports less than the module declares, and fails at the call site.
      #
      # A directory holding `.bs` files is a module and one holding only
      # directories is a namespace (41 §5), so the loop asks for the first and
      # walks through the second. `--src-root examples` is named because the
      # corpus holds dotted modules — `Shop.Reports` lives at `Shop/Reports` —
      # and 41 §3 makes naming the root the caller's job, never the compiler's.
      - name: Examples compile and run
        working-directory: compiler
        run: |
          # `exemplars/` is PRUNED, and that exclusion is the point of the step
          # rather than an oversight: ticket 25's three exemplars are the
          # compiler's target and none of them parses yet. The old top-level glob
          # excluded them by accident; recursing without this prune turns the
          # must-run surface into a must-fail one.
          find examples -path examples/exemplars -prune -o -name '*.bs' -print0 |
            while IFS= read -r -d '' f; do dirname "$f"; done | sort -u |
            while IFS= read -r d; do
              echo "  $d"
              ./_build/default/bin/bsc --src-root examples -o "$(mktemp -d)" "$d" || exit 1
            done

      # THE DIAGNOSTIC IS A TERM, AND PROSE IS A PURE FUNCTION OF IT (F16).
      #
      # This one guards a drift that reopens SILENTLY and with every test still
      # green. F16 moved 56 `io:format` calls into `bs_diag` so that the message
      # is derived from a descriptor; the next person to add a diagnostic can
      # write the prose inline at the site that found the problem, and nothing
      # fails — the prose would be right, and only the term would be wrong.
      #
      # It checks the SHAPE of the format string rather than the call, because a
      # diagnostic names a source location and a usage error never can. That
      # distinction is what lets the CLI keep printing `bsc: which function?` to
      # stderr without an exemption. It was measured failing on all three of its
      # checks before it was believed.
      - name: Diagnostics are terms
        working-directory: compiler
        run: ./bin/check-diagnostics.sh

      # Dialyzer over every emitted spec, plus two negative controls that corrupt
      # a real emitted artefact and REQUIRE the corruption to be caught — because
      # a clean run proves nothing unless a wrong spec would fail it.
      #
      # Excluded from this workflow until 2026-08-15, when F10 resolved ticket 35.
      # `counter.bs` had declared `behaviour GenServer` while emitting `'Init'/1`
      # and `'HandleCall'/3`, so the attribute named a contract the module could
      # never satisfy. Callbacks now lower through a compiler-known table and a
      # missing mandatory one is an error at the declaration.
      - name: Emitted specs survive Dialyzer
        working-directory: compiler
        run: ./bin/spec-check.sh

      # THE TWO EDITOR GATES, WIRED IN 2026-08-17 AFTER FIVE FEATURES OF DRIFT.
      #
      # `editor/` was the one directory this file did not mention, and the cost
      # was exactly what the header above predicts of an unwatched check: the
      # tree-sitter grammar was missing string literals (F9), `and`/`or` — it
      # still carried the REMOVED `&&`/`||` (ticket 44) — `var` (F8), `== name`
      # (45) and `where` (F2). Five shipped features the grammar had never
      # gained, in a repo where every compiler-facing gate was green.
      #
      # Worse, only ONE of the five was visible: `check-corpus.sh` aborted at its
      # first failing file, so it reported one problem and held four. Both the
      # abort and all five forms are fixed, which is what makes it safe to make
      # this required rather than aspirational.
      #
      # `check-tokens.sh` needs nothing. `check-corpus.sh` SKIPS WITH EXIT 0 when
      # the tree-sitter CLI is absent, so the CLI is installed here on purpose: a
      # gate that silently skips is worse than one that is honestly missing,
      # which is the whole argument of this file.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the tree-sitter CLI
        run: npm install -g tree-sitter-cli

      - name: The editor grammars know every shipped keyword
        run: ./editor/bin/check-tokens.sh

      - name: The editor grammar parses every example
        run: ./editor/bin/check-corpus.sh

      # The exemplars are generated from ticket 25's write-ups, which are
      # canonical; this fails if the committed copies have drifted.
      #
      # Also excluded until 2026-08-15, and by then it had been fixed by someone
      # else — the write-ups were brought onto the unified dialect in an earlier
      # session and nothing came back to re-enable the gate. An exclusion that
      # outlives its reason is the same failure this file was written about.
      - name: Exemplars are not stale
        working-directory: compiler
        run: ./bin/extract-exemplars.sh --check

# NOTHING IS EXCLUDED FROM THIS WORKFLOW.
#
# There was a block here naming two scripts that failed on master, on the
# principle that an unlisted broken check is how the repo ended up with three
# verification scripts and no CI. Both are now steps above. Keep it that way: if
# a gate has to come out, it goes back in this block with the reason, and the
# reason gets re-checked rather than inherited.
#
# AND THE SENTENCE ABOVE WAS TRUE OF THE COMPILER AND FALSE OF THE REPO until
# 2026-08-17. `editor/bin/` held two gates this file had never mentioned — not
# excluded with a reason, simply never considered — and they accumulated five
# features' worth of drift while every gate named here stayed green. An
# unmentioned check is not outside the rule above; it is the rule's blind spot.
# A new verification script belongs in this file on the day it is written.
