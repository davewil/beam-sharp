# CI for the beam-sharp compiler.
#
# There was none before 2026-08-14. That is the background to what this file
# does and does not run: the repo already had three verification scripts, and
# on the day CI was added TWO OF THEM FAILED ON MASTER. Nothing was watching, so
# nothing said. The gates below are the ones that pass; the ones that do not are
# named at the bottom rather than quietly left out, because an unlisted broken
# check is how this happened in the first place.

name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  compiler:
    # THE RUNNER IMAGE IS PINNED, AND IT STOPPED BEING OPTIONAL ON 2026-08-26.
    #
    # This block used to argue the opposite — that `ubuntu-latest` was left
    # floating deliberately, because pinning means a dated migration GitHub
    # forces on its own schedule. That reasoning was sound while the image only
    # supplied a libc and a coreutils. It stopped being sound when the toolchain
    # moved to `mise`: the precompiled OTP is fetched from
    # `builds.hex.pm/builds/otp/<arch>/<os_ver>/`, so the runner label now
    # SELECTS WHICH OTP TARBALL ARRIVES. A floating image is a floating compiler.
    #
    # The cost the old note named is real and is now simply owed: `ubuntu-24.04`
    # has a published retirement date, and this line is a maintenance task rather
    # than a set-and-forget. `MISE_ERLANG_COMPILE: "false"` is what makes that
    # safe to forget until it matters — when hex has no build for the image, the
    # install fails loudly instead of quietly compiling from source.
    #
    # `bin/check-toolchain.sh` enforces this, and was seen to fail on both jobs
    # before the pin went in.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # THE GATES THAT CHECK THE GATES RUN FIRST. They need no compiler, so a
      # suite that cannot be trusted goes red before anything expensive runs.
      #
      # EVERY GATE RUNS ITS OWN --self-test FIRST, as a separate step. A gate is
      # believed here only if it has been shown to fail on the defect it names
      # and to pass on the correct form beside it; `spec-check.sh` has held that
      # line since ticket 15 lost a session to a harness that supplied the
      # protection it was measuring. Folded into the gate itself, one exit code
      # would cover two questions and "the suite is green" would stop
      # distinguishing "no violations" from "the check still works".
      #
      # ON 2026-09-05 SEVEN GATES AND NINE DETECTORS WERE REMOVED FROM THIS
      # SECTION: the map-index budget, three checks on a generated decisions
      # digest, surface and open-question traceability into the tracker, a
      # cwd-independence check on the gates themselves, and a detector suite for
      # the repository's own recurring mistakes. Every one guarded the tracking
      # layer rather than the language or the handoff, and that layer had begun
      # generating its own commits: of the sixty before the cut, classified by
      # the first bucket each touches, 11 were compiler source and tests, 21 the
      # spec and its gates, 6 tickets and research, and 20 the tracking layer
      # and its gates. The design record is
      # the tickets in `wayfinder/issues/`; Linear owns their state; nothing
      # gates their form.
      - name: The gate-gates prove they can fail
        run: |
          ./bin/check-gates-wired.sh --self-test
          ./bin/check-shell.sh --self-test
          ./compiler/bin/check-no-silent-skip.sh --self-test
          ./bin/check-links.sh --self-test
          ./bin/check-toolchain.sh --self-test
          ./bin/verify.sh --self-test
          ./compiler/bin/extract-exemplars.sh --self-test

      # A gate nothing runs is not a gate. `editor/bin/` held two gates this
      # file had never mentioned, and they collected five features of grammar
      # drift while every named gate stayed green. Prose at the foot of this
      # file already forbade it. Prose cannot check itself.
      - name: Every gate on disk is wired into this file
        run: ./bin/check-gates-wired.sh

      # Every gate here is shell, so a quoting bug in one is a bug in the thing
      # that decides whether everything else is correct — and this repo's own
      # record is exactly that: check-links.sh reported 6 dead paths where there
      # were 20, then misnumbered its own output. shellcheck at `info`, which is
      # where SC2086 lives; `warning` looked tidier and could not see the class.
      - name: The gates are shellcheck-clean
        run: ./bin/check-shell.sh

      # THIS ONE RUNS BEFORE THE TOOLCHAIN IS INSTALLED, ON PURPOSE. It asks
      # whether this file re-declares any version the manifest already pins,
      # whether every `uses:` names a commit, and whether every `runs-on:` names
      # a pinned image — none of which needs a compiler. The matching question,
      # is the toolchain that ARRIVED the pinned one, is a separate run further
      # down, once there is something to ask.
      - name: The manifest and the workflow pin the same toolchain
        run: ./bin/check-toolchain.sh

      # `check-links.sh` asks whether the shipping documents point at things
      # that exist, which no compiler-facing gate can. Measured 2026-08-18, the
      # shipping package carried 25 citations of `examples/<name>.bs` paths that
      # had not existed since F15 made a module a DIRECTORY — in the feature
      # files, in `LANGUAGE.md`, and in the header comment of `Totals.bs` telling
      # a reader how to run it. Every gate in this repo proved the compiler was
      # right and none proved the documents were.
      #
      # It also holds `LANGUAGE.md` to its own opening rule — no ticket numbers
      # in visible prose, because the clean-room handoff gives an implementer
      # that document and no access to `wayfinder/`. The file called that rule
      # "load-bearing rather than tidy" and had 12 violations.
      - name: The package points only at things it ships
        run: ./bin/check-links.sh

      # ONE INSTALLER, READING THE ONE MANIFEST.
      #
      # `.tool-versions` was already the source of truth; it is now the only
      # place the versions appear at all. This file used to carry four literals
      # in each of two jobs, purely because `with:` inputs cannot read a file,
      # and a gate existed to catch them drifting from the manifest. `mise`
      # installs from the manifest directly, so the copies — and the entire class
      # of bug where a copy and the manifest disagree — are gone rather than
      # policed. Ticket 13 §4 still pins the supported range at the current
      # release and the previous two majors; only the current one is exercised
      # here, and the corpus proving the full range remains a debt.
      #
      # THIS IS NOT A DOWNGRADE FROM setup-beam, AND IT WAS MEASURED BEFORE IT
      # WAS BELIEVED. mise fetches precompiled OTP from
      # `builds.hex.pm/builds/otp/<arch>/<os_ver>/builds.txt` — the SAME host,
      # the same path shape and the same tarballs `erlef/setup-beam` fetches on
      # Linux, checksummed from the same listing. In an `ubuntu:24.04` container
      # it installed `amd64__ubuntu-24.04__OTP-28.5.tar.gz` in 13 seconds and
      # `OTP_VERSION` read exactly `28.5`. The one capability setup-beam has that
      # mise lacks is hex MIRROR fallback, which matters during a hex outage and
      # not otherwise.
      #
      # `28.5` IS EXACT HERE WITHOUT HAVING TO ASK. setup-beam defaulted to
      # `loose`, where a version is a SPEC, and installed **28.5.0.5** from the
      # string `28.5` — an exact-looking pin that floated, and the reason
      # `version-type: strict` used to be on the step above. mise lists `28.5` as
      # a version in its own right, distinct from `28.5.0.1`–`28.5.0.5`, so there
      # is no range to opt out of.
      #
      # `MISE_ERLANG_COMPILE: "false"` FORBIDS THE SOURCE BUILD rather than
      # merely preferring a binary. Left unset, mise falls back to a kerl build
      # when no precompiled target matches: a green run that quietly takes
      # fifteen minutes and yields a differently-built OTP. In
      # `src/plugins/core/erlang.rs` that fallback becomes `bail!` when this is
      # false, so a missing build for a future runner image is a loud red. It is
      # also why `runs-on` is pinned — the precompiled URL is keyed to the image.
      #
      # NODE AND THE TREE-SITTER CLI ARRIVE HERE TOO, rather than beside the
      # editor gates that use them. The whole pinned toolchain has to be present
      # before the step below can say whether this machine is running it, and a
      # check that runs after the escript is built is not a check "before
      # compilation" — it is a post-mortem. The editor gates' own reasoning
      # stayed where the gates are.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          MISE_ERLANG_COMPILE: "false"
        with:
          # mise itself is pinned, for the same reason everything else here is:
          # an unpinned installer is a floating input one level up.
          version: 2026.8.14
          install: true
          cache: true

      # AND THE INSTALLED VERSIONS ARE CHECKED BEFORE ANYTHING COMPILES.
      #
      # The step above declares what to install; this one asks what actually
      # arrived. They remain different questions even with one installer reading
      # one manifest — a tool that failed to install, or a system copy earlier on
      # PATH, both leave the manifest looking satisfied. That is not theoretical:
      # on the machine this was written on, `node` resolved to a hand-managed
      # install mise had no view of, and `--env` was the only thing that could
      # have noticed.
      - name: This machine runs the pinned toolchain
        run: ./bin/check-toolchain.sh --env

      # THE ESCRIPT IS BUILT BEFORE THE TESTS, AND THE ORDER IS LOAD-BEARING.
      #
      # Several tests drive `bsc` as a subprocess, because a feature is done
      # when you can see it run and the CLI is what a person actually types.
      # Those tests resolve it at `_build/default/bin/bsc`, so with `eunit`
      # first they either fail on a fresh checkout or — worse — skip silently.
      #
      # Both happened. `cli_tests:built_escript_compiles_a_file_test` guarded
      # itself with `is_regular/1` and had therefore never once executed in CI,
      # and F9 then added two CLI tests without that guard, which turned the
      # blind spot into a red build. Building first is what makes either kind
      # of test mean anything here.
      - name: Build the escript
        working-directory: compiler
        run: rebar3 escriptize

      - name: The README REPL transcript gate proves it can fail
        run: ./compiler/bin/check-readme.sh --self-test

      - name: README bindings replay in the public REPL
        run: ./compiler/bin/check-readme.sh

      # THE PACKAGE THAT SHIPS MUST STAND ALONE, WHICH IS NOT WHAT
      # `check-links.sh` ABOVE ASKS.
      #
      # That gate holds the shipping documents to their link policy where they
      # sit in this tree, and deliberately ALLOWS references into `wayfinder/` —
      # it counts them and passes, with a comment saying the question is bigger
      # than one gate. It is: measured 2026-08-26, the package carried 115 such
      # references, 98 across 27 of the 28 feature files. Every one is correct
      # in the repository and dead in a recipient's hands.
      #
      # This step assembles the package OUTSIDE the source tree and checks the
      # thing a recipient would actually be given. It runs after the escript
      # because its last question is whether the artifact's examples still
      # compile — the specification/compiler boundary, with `bsc` as the oracle
      # a clean-room recipient does not have.
      - name: The handoff package proves it can fail
        run: |
          ./bin/build-handoff.sh --self-test
          ./bin/check-handoff-package.sh --self-test

      - name: The handoff package is self-contained and reproducible
        run: ./bin/check-handoff-package.sh

      # TOUR.md quotes the corpus and pastes what the compiler printed, and
      # `check-language.sh` can reach neither. That gate COMPILES the blocks it
      # checks, which works for LANGUAGE.md because those blocks are whole
      # programs; the tour's are excerpts — a few clauses without the signature
      # above them — so they do not compile alone. This proves instead that every
      # quoted line is verbatim in `compiler/examples/`, that every capability
      # `demonstrated_surface/0` names has a chapter, and that every replayable
      # `$ bsc …` transcript still prints what is written beside it.
      #
      # A FOURTH PART CHECKS THE PUBLISHED PAGE, which is a snapshot and tracks
      # nothing. It compares TOUR.md against the hash in `TOUR.published`, so
      # editing the tour without republishing goes red. It is a stamp rather
      # than a fetch because the artifact is private — `curl` gets the SPA shell
      # or a 403, and a runner has no claude.ai login. `TOUR.published` carries
      # that reasoning and the limits of what a stamp can prove.
      #
      # IT RUNS AFTER THE ESCRIPT BECAUSE THE THIRD PART EXECUTES THE COMPILER,
      # and it exits 2 rather than skipping when the escript is missing. Two of
      # the transcripts did not reproduce the day this was written, so the part
      # that needs a build is the part that found the defect.
      # ITS SELF-TEST IS DOWN HERE RATHER THAN WITH THE OTHER FOUR, and the
      # reason is the same one that moved the gate itself: part 3 executes the
      # compiler, so the controls cannot run before `escriptize`. It refuses
      # rather than skipping when the escript is missing, which is what keeps
      # this placement from quietly becoming a no-op if the steps are reordered.
      #
      # Twelve positive controls and one negative, one per claim the gate
      # makes: the four it was built with — an invented clause, a dropped
      # capability, a wrong pasted output, and a command in the document that
      # must NOT execute — the stamp's two, and six ways an `expect-after`
      # transcript can be wrong. The command is checked by its side effect
      # rather than by reading the code, since this gate did once run a
      # markdown line through `eval`. The controls run concurrently since
      # ENG-315 (2026-09-03); each is still the whole gate over the whole
      # document, and each verdict is read from that run's own output.
      - name: The tour gate proves it can fail
        run: ./compiler/bin/check-tour.sh --self-test

      - name: TOUR.md quotes the corpus and replays what it pasted
        run: ./compiler/bin/check-tour.sh

      # THE AUDITION'S MARKING IS ITSELF A GATE, and it is deliberately NOT
      # covered by `check-gates-wired.sh`. That gate's directory list is a
      # definition of what this repo calls a gate, and `handoff/audition-switch`
      # does not qualify: it holds `run.sh`, which spawns four billed external
      # CLIs and must never run here. Adding the directory would force that
      # basename into this file to satisfy the enumeration, and a file named in
      # the workflow reads as wired whether or not it is.
      #
      # So the two that ARE gates are named here directly. `check.sh --self-test`
      # is placed after `escriptize` because its negative control delegates to
      # `bsc`; without the escript it cannot prove a correct implementation is
      # accepted, which is the half that stops the check being unpassable.
      #
      # What it guards: the marking could not tell an implementation from a
      # lookup table until 2026-08-20, because `check.sh` passes the case's
      # identity in argv[1]. `heldout/` is what closes that, and this step is
      # what stops it being deleted quietly — park the directory and the
      # self-test goes red naming it.
      - name: The audition can tell an implementation from a lookup table
        run: ./handoff/audition-switch/check.sh --self-test

      - name: Neither answer set is reachable from a worker sandbox
        run: ./handoff/audition-switch/stage.sh --self-test

      - name: Tests
        working-directory: compiler
        run: rebar3 eunit

      # A TEST THAT RETURNS `ok` FOR WORK IT DID NOT DO IS NOT A TEST.
      #
      # `cli_tests:built_escript_compiles_a_file_test` guarded itself with
      # `is_regular/1` and returned `ok` when the escript was absent — and eunit
      # ran BEFORE escriptize, so it passed without executing anything from the
      # day it was written. That one was fixed. Measured 2026-08-18, the same
      # shape was still live at 11 sites across 8 modules.
      #
      # The rule is "not silently" rather than "never skip", because the suite
      # already had two remedies and they disagree about the fix while agreeing
      # about the fault: `cli_tests` dropped its guard and throws, `repl_tests`
      # kept its guard and prints SKIPPED. Both pass. What does not is the third
      # thing — a guard that returns `ok` and says nothing.
      #
      # It runs AFTER the suite so a real failure is read before this one.
      - name: No test passes without running
        working-directory: compiler
        run: ./bin/check-no-silent-skip.sh

      # A HELPER THAT AGREES WITH THE TESTS IS NOT EVIDENCE.
      #
      # The circular-prototype class: a harness that supplies the answer it is
      # measuring. Ticket 15 lost a session to one. F14 found `check_only/1`
      # skipping the lowering, so an unlowered `e_valve` typed as `term()` and
      # "every valve assertion about clean source would have passed while
      # nothing was checked at all" — green tests, nothing checked.
      #
      # That hole is still structurally open: `check_only/1` REPRODUCES
      # `bsc:parse_string/2` rather than calling it, so the next pass added to
      # the front end re-opens it silently. This runs the helper and the
      # compiler over the same sources and requires the same DIAGNOSTIC TAG.
      #
      # Tags rather than pass/fail, and the self-test is why: the pre-F14 helper
      # rejects the valve probe too, with `return_not_declared` instead of
      # `valve_on_infallible`. Both say "no" about different things, and a
      # helper that is right by coincidence is what this gate is for. It is the
      # first consumer of F16's `--diagnostics term` outside the tests.
      #
      # It runs after eunit because it needs the test beams and the escript.
      - name: The check helper walks the compiler's path
        working-directory: compiler
        run: |
          ./bin/check-helper-agrees.sh --self-test
          ./bin/check-helper-agrees.sh

      # Every beam-sharp block in LANGUAGE.md is compiled and checked against
      # what it claims to be — untagged blocks must compile, `not-yet` blocks
      # must NOT. The second half is the one that pays: when a feature lands,
      # this names the paragraphs that now need promoting.
      #
      # It exists because the reference is written from the decisions rather
      # than from the compiler, and on 2026-08-14 it was showing two constructs
      # the language had never had.
      # Its self-test is here rather than with the cheap ones because the
      # controls COMPILE, and the `not-yet` control has to actually be accepted
      # by the compiler for the check it exercises to mean anything.
      - name: The reference gate proves it can fail
        working-directory: compiler
        run: ./bin/check-language.sh --self-test

      - name: LANGUAGE.md compiles
        working-directory: compiler
        run: ./bin/check-language.sh

      # ENG-248. The step above proves every example in the reference does what
      # it claims; this one proves the reference has an example for every
      # diagnostic a `switch` can provoke — which is the half that was missing.
      #
      # The clean-room audition hands a worker sections 2, 3 and 5 and asks for
      # the exhaustiveness checker back. Three of the seven diagnostics those
      # programs can provoke were named nowhere in the reference, so no reader
      # of it could have known they existed. The surface is re-read from
      # `switch_tests.erl` on every run rather than kept as a list here: the
      # audition's own report counted six because `switch_in_guard` is asserted
      # as a bare atom where the others carry a payload, and a list would have
      # inherited that miscount permanently.
      - name: The switch diagnostic gate proves it can fail
        working-directory: compiler
        run: ./bin/check-switch-diagnostics.sh --self-test

      - name: Every switch diagnostic is in the specification
        working-directory: compiler
        run: ./bin/check-switch-diagnostics.sh

      # THE WHOLE BET OF THE LANGUAGE, AND NOTHING CHECKED IT UNTIL NOW.
      # `README.md:26-28` promises the compiler hands back the clause head you
      # have not written, in the syntax you would write it in. Six of the ten
      # shapes do not survive that sentence. The gate is GREEN anyway, because
      # its floor is a per-shape expected-verdict table rather than "everything
      # pastes": it is red if any shape moves in EITHER direction, so it guards
      # the four that work today and turns F29's done-when into something
      # checkable — F29 is finished when every entry reads `clean`.
      - name: The residual round-trip gate proves it can fail
        working-directory: compiler
        run: ./bin/check-residual-pasteable.sh --self-test

      - name: The synthesised head round-trips to its recorded verdict
        working-directory: compiler
        run: ./bin/check-residual-pasteable.sh

      # PER DIRECTORY SINCE F15, because a directory IS the module now (ticket 13
      # §3). A per-file invocation is not merely outdated here, it is wrong: it
      # emits a `.beam` missing every other file in the module, which loads,
      # exports less than the module declares, and fails at the call site.
      #
      # A directory holding `.bs` files is a module and one holding only
      # directories is a namespace (41 §5), so the loop asks for the first and
      # walks through the second. `--src-root examples` is named because the
      # corpus holds dotted modules — `Shop.Reports` lives at `Shop/Reports` —
      # and 41 §3 makes naming the root the caller's job, never the compiler's.
      #
      # A SCRIPT SINCE ENG-314 (2026-09-03), not a loop written here and again
      # in `bin/verify.sh`: the modules compile in one `bsc --batch` VM, and a
      # manifest-writing loop copied into two files is the drift
      # `check-gates-wired.sh` exists to stop. `exemplars/` is still pruned, for
      # the reason the script's header gives — ticket 25's three exemplars are
      # the target and none parses yet — and the gate now has the `--self-test`
      # the inline loop never had.
      - name: The examples gate proves it can fail
        working-directory: compiler
        run: ./bin/check-examples.sh --self-test

      - name: Examples compile and run
        working-directory: compiler
        run: ./bin/check-examples.sh

      # A SHIPPING DOCUMENT MAY NOT CONTRADICT THE COMPILER ABOUT WHAT IS BUILT.
      #
      # It runs HERE, after the examples, because that is its oracle: it asks
      # whether `examples/Shop` compiles and then refuses to let any document
      # call records unbuilt. Placed with the other document gates above it
      # would have no compiler to ask and would pass by finding nothing.
      #
      # The defect it was written against (ENG-245) is the sharpest kind this
      # repo has had, because every gate was green while it stood:
      # `compiler/README.md` listed records, angle brackets, modules, FFI, OTP
      # behaviours, refinements and binaries as "deliberately out" — all seven
      # shipped, and SIX OF THEM ARE COMPILED BY THE STEP DIRECTLY ABOVE THIS
      # ONE. The repository was building the refutation of its own README on
      # every run and reporting success, because nothing had ever asked a
      # document whether it agreed with the compiler.
      - name: The status-claim gate proves it can fail
        run: ./bin/check-status-claims.sh --self-test

      - name: Shipping documents agree with the compiler about what is built
        run: ./bin/check-status-claims.sh

      # THE DIAGNOSTIC IS A TERM, AND PROSE IS A PURE FUNCTION OF IT (F16).
      #
      # This one guards a drift that reopens SILENTLY and with every test still
      # green. F16 moved 56 `io:format` calls into `bs_diag` so that the message
      # is derived from a descriptor; the next person to add a diagnostic can
      # write the prose inline at the site that found the problem, and nothing
      # fails — the prose would be right, and only the term would be wrong.
      #
      # It checks the SHAPE of the format string rather than the call, because a
      # diagnostic names a source location and a usage error never can. That
      # distinction is what lets the CLI keep printing `bsc: which function?` to
      # stderr without an exemption.
      #
      # IT WAS MEASURED FAILING ON ITS CHECKS BEFORE IT WAS BELIEVED, AND THAT
      # MEASUREMENT IS NOW A STEP RATHER THAN A SENTENCE. It was done by hand
      # once and lived here as a claim; the controls below rebuild all four
      # defects — a stray `~s:~p: error:` outside `bs_diag`, a minted tag with
      # no message clause, a message clause for a tag nothing mints, and a call
      # site that stopped delegating — and require each red to name its own.
      - name: The diagnostics gate proves it can fail
        working-directory: compiler
        run: ./bin/check-diagnostics.sh --self-test

      - name: Diagnostics are terms
        working-directory: compiler
        run: ./bin/check-diagnostics.sh

      # F20 / ticket 54 — the checker must see a list's length IN BOTH
      # DIRECTIONS, because the two halves have one root and get fixed
      # independently: `[]` beside `[a, b, ..]` was proved exhaustive and
      # crashed on `[7]`, while a closed prefix subtracted nothing at all.
      #
      # The self-test builds BOTH defects and requires each to be caught on a
      # probe the other passes, so no probe can be a fires-on-everything check.
      # A fourth control feeds it a run that never compiled, because the probe
      # asserting the ABSENCE of a warning went green over a parse error the
      # first time this gate was run for real.
      #
      # Not a `<!-- check: -->` block in LANGUAGE.md: `bsc` exits 0 on a
      # warning-only module, so a doc block cannot see the third probe.
      - name: The list-length gate proves it can fail
        working-directory: compiler
        run: ./bin/check-list-length.sh --self-test

      - name: The checker sees a list's length
        working-directory: compiler
        run: ./bin/check-list-length.sh

      # F26 / ticket 38. `/` lowers to Erlang's `div` and never its `/`, which
      # is float division — a defect the type checker cannot see, because the
      # emitter runs after it, and one that returns a FLOAT where the signature
      # promised `int`. The gate asserts the value and gets the emission for
      # free. Its other half is the pair of rules around a zero divisor, which
      # fail in opposite directions: not firing at all, and firing on every
      # literal. The self-test builds all three defects including that
      # cry-wolf.
      - name: The division gate proves it can fail
        working-directory: compiler
        run: ./bin/check-division.sh --self-test

      - name: '`/` lowers to div, and only a provable zero is refused'
        working-directory: compiler
        run: ./bin/check-division.sh

      # Ticket 67. `List` is an operation set the compiler knows, not a module
      # it ships — and 67's (b) is INDISTINGUISHABLE from its (a) in anything a
      # program prints. `List.Sum([2,2,2])` is 6 either way. So this gate reads
      # the compiled beam's import chunk: an inlined operation names no module,
      # a resolved one names exactly the module it resolved to, and a
      # `lists:sum/1` is (a) wearing (b)'s clothes. Its self-test's
      # `shipped_module` stub is the over-informed one — right answer, wrong
      # design — and it is the only stub a value-checking gate would pass.
      #
      # The other four probes are two pairs that fail in opposite directions:
      # `module List` is refused while `module Shop.List` must not be (67 Q6
      # declined burning the path segment), and a namespace import shadowing
      # `List` is refused at the call while a non-reserved short qualifier must
      # keep working. The self-test builds both cry-wolves.
      - name: The reserved-qualifier gate proves it can fail
        working-directory: compiler
        run: ./bin/check-reserved-qualifiers.sh --self-test

      - name: '`List`, `Term` and `Map` are reserved qualifiers, inlined at the site'
        working-directory: compiler
        run: ./bin/check-reserved-qualifiers.sh

      # F27 / ticket 63. The language has no `not`, and the decision came with
      # an obligation: the absence must name the comparison to write instead.
      #
      # Two things make this worth a gate rather than only eunit. The positions
      # the decision covers fail at DIFFERENT tokens — `'('` in a guard, `'>'`
      # in a refinement — so an implementation keyed on the token yecc reported
      # passes one and misses the other silently; the self-test's `half` stub
      # is that defect. And `not` is a legal IDENTIFIER, which reserving it
      # would quietly stop being true — that is ticket 65's decision, not 63's,
      # so P4 compiles and runs a program using `not` as a variable name and
      # asserts its value exactly.
      - name: The negation gate proves it can fail
        working-directory: compiler
        run: ./bin/check-negation.sh --self-test

      - name: 'No `not` and no `!`, both taught, and `not` is still a name'
        working-directory: compiler
        run: ./bin/check-negation.sh

      # F28 / ticket 09, ENG-260. A STOPWATCH, not a rejection test: the
      # characteristic failure of recursive types produces no output at all,
      # because the checker walks a regular tree forever. F6 measured that shape
      # once already — a cyclic alias did not error on master, it hung, and took
      # the rest of that eunit run with it under a `Failed: 0` summary. So every
      # probe compiles under a wall-clock budget, and the self-test carries seven
      # defects including the two that are silent rather than slow: the refusal
      # dropped entirely, and a binder tied on the name rather than the
      # instantiation.
      - name: The recursive-types gate proves it can fail
        working-directory: compiler
        run: ./bin/check-recursive-types.sh --self-test

      - name: Recursive types resolve, and the two that cannot still refuse
        working-directory: compiler
        run: ./bin/check-recursive-types.sh

      # F31 / ticket 15 §1, ENG-272. A declared failure channel must survive
      # normalisation: `option<atom>` IS `atom`, so no caller can write the
      # failure clause. F18 built the predicate at the `ValidateAs<T>`
      # obligation site only, and two documents — ticket 49's shape C and
      # `PRELUDE.md`'s `ToExistingAtom` entry — leaned on a declaration-site
      # refusal that did not exist.
      #
      # The roster is eleven shapes because 15 §1 names its own wrong
      # implementation: "an implementer would write the cofinite check alone".
      # `option<option<int>>` has no atom top and `result<(atom, binary),
      # binary>` collides on a TUPLE SHAPE, so the self-test's `atom_top` stub
      # is that exact defect and both shapes are what see it. The `spelling`
      # stub is the other one: a rule keyed on `option<...>` misses the
      # hand-written alias, which is how `ToExistingAtom` is spelled.
      - name: The collapse gate proves it can fail
        working-directory: compiler
        run: ./bin/check-collapse.sh --self-test

      - name: 'A declared failure channel survives normalisation'
        working-directory: compiler
        run: ./bin/check-collapse.sh

      # ENG-276. The test suite navigates by scenario identifier — `%% F25.4 —
      # a record in the RESIDUAL has no writable spelling` — and three features
      # cited sixteen of them from tests while defining none in the feature
      # file. A clean-room reader following the citation found the document and
      # no such section, with only the excluded compiler source to fall back on.
      #
      # The self-test's `index_only` stub is the one that earns this gate: the
      # identifier IS under `features/`, in `README.md`. A gate that greps the
      # directory rather than the named file goes green on it and the reader
      # still finds nothing. `suffix` is the other: `F26.1b` is real, and a rule
      # that strips the letter reports green over a missing section.
      - name: The feature-scenario gate proves it can fail
        working-directory: compiler
        run: ./bin/check-feature-scenarios.sh --self-test

      - name: 'Every scenario identifier the code cites is defined in its feature document'
        working-directory: compiler
        run: ./bin/check-feature-scenarios.sh

      # F21 / ticket 36. `Order{ Id = :oops }` and `o with { Total = :oops }`
      # both compiled to a .beam, and `o with { Nope = 1 }` compiled and raised
      # {badkey,'Nope'} at RUN time — 26 §2 enforced by the BEAM rather than by
      # the compiler.
      #
      # The self-test's third stub is the one that earns this gate: VALUE-ONLY
      # implements the ticket's stated delta exactly — values checked at both
      # spellings, names untouched — and fails only probe 3. A gate written from
      # the ticket's text would have two probes and would call that build done.
      - name: The field-value gate proves it can fail
        working-directory: compiler
        run: ./bin/check-field-values.sh --self-test

      - name: A field assignment is checked, at both spellings
        working-directory: compiler
        run: ./bin/check-field-values.sh

      # F22 / ticket 55. `Frame { Type: :method }` is new surface over an old
      # meaning, so the thing to defend is that it narrows the residual by
      # EXACTLY what `{ Kind: :'Mod.Frame', … }` narrows it by. The two
      # directions are not equally dangerous: too little is loud, too much is a
      # program the compiler proves exhaustive and the BEAM crashes — ticket
      # 54's shape, which sat inside a green suite of 449 tests.
      #
      # The self-test's SILENT stub is that bug exactly, and the BROKEN stub is
      # the vacuity control: probe 1 must fire on the exit code even when the
      # output is empty, because "no diagnostic appeared" is free the moment the
      # run dies earlier.
      - name: The record-pattern gate proves it can fail
        working-directory: compiler
        run: ./bin/check-record-pattern.sh --self-test

      - name: A type prefix subtracts what the Kind spelling subtracts
        working-directory: compiler
        run: ./bin/check-record-pattern.sh

      # ENG-307 / ticket 55. The gate above proves the two spellings agree; it
      # says nothing about which one the corpus TEACHES, and the corpus taught
      # the hatch: `shop.bs`, TOUR.md, F3's scenarios, the shared test fixture
      # and the residual gate's own `RecordUnion` input all dispatched with a
      # hand-written `{ Kind: :'Shop.Order' }` — fifteen lines, seven files,
      # and `refused_spelling` only ever judged what the PRINTER emits.
      #
      # The self-test's ARM stub earns this gate: a switch arm starts with `{`,
      # not a function name, so a gate that finds clause heads by their leading
      # identifier reads straight past it. PROSE is the other half — this
      # comment names the hatch and must not be a defect.
      - name: The record-idiom gate proves it can fail
        working-directory: compiler
        run: ./bin/check-record-idiom.sh --self-test

      - name: 'A record is dispatched by naming its type, never by writing its tag'
        working-directory: compiler
        run: ./bin/check-record-idiom.sh

      # F24 / ticket 58. `Classify(100.5)` returned `:reserved` from a parameter
      # published as `-spec 'Classify'(0..255)` — ticket 18 §1 rule C case (b),
      # decided 2026-08-13 with no opt-out, and never in the emitter.
      #
      # THE SELF-TEST'S RANGE STUB IS WHAT EARNS THIS GATE. It implements ticket
      # 46's range subtraction — the obvious fix, and the one already written
      # down — and leaves the reported defect exactly where it was: `100.5`
      # reaches the `Classify(>= 9)` clause and `100.5 =< 255` is true, so a
      # range-only guard refuses `300.5` and admits `100.5`. A gate built around
      # `300.5` would call that stub fixed. Probe 1 is therefore `100.5`.
      #
      # Probes 1 and 4 assert ABSENCES and are paired with presence probes on
      # the same modules, because an absence goes green for free over a run that
      # never compiled — check-list-length.sh learned that the expensive way.
      - name: The boundary-kind gate proves it can fail
        working-directory: compiler
        run: ./bin/check-boundary-kind.sh --self-test

      - name: An int parameter is an integer at the boundary
        working-directory: compiler
        run: ./bin/check-boundary-kind.sh

      # F25 / ticket 23 §8 — a return-mismatch diagnostic must hand over the
      # signature to PASTE, not only the residual that is uncovered. §4's test
      # for the contractual subset is §2's: does it hand the agent something to
      # write?
      #
      # THE TWO STUBS THAT EARN THIS GATE ARE PER-CLAUSE AND OVERREACH, and both
      # were measured before the gate was written. Two offending clauses produce
      # two diagnostics, so a correction computed per clause prints two
      # contradictory pasteable lines and neither is sufficient. And
      # `bs_types:to_string/1` renders a record as ticket 26 §1's minted tag, so
      # a signature carrying it hard-codes a mint instead of naming the record —
      # a line that LOOKS pasteable and is not, which is the exact failure §2
      # exists to prevent. A gate that only asked "is the heading there?" goes
      # green over both.
      #
      # Probe 3 asserts an ABSENCE and probe 4 is the clean compile that makes it
      # a measurement rather than a vacuum.
      - name: The corrected-signature gate proves it can fail
        working-directory: compiler
        run: ./bin/check-corrected-signature.sh --self-test

      - name: A return mismatch hands over the signature to paste
        working-directory: compiler
        run: ./bin/check-corrected-signature.sh

      # Dialyzer over every emitted spec, plus two negative controls that corrupt
      # a real emitted artefact and REQUIRE the corruption to be caught — because
      # a clean run proves nothing unless a wrong spec would fail it.
      #
      # Excluded from this workflow until 2026-08-15, when F10 resolved ticket 35.
      # `counter.bs` had declared `behaviour GenServer` while emitting `'Init'/1`
      # and `'HandleCall'/3`, so the attribute named a contract the module could
      # never satisfy. Callbacks now lower through a compiler-known table and a
      # missing mandatory one is an error at the declaration.
      - name: Emitted specs survive Dialyzer
        working-directory: compiler
        run: ./bin/spec-check.sh

      # THE TWO EDITOR GATES, WIRED IN 2026-08-17 AFTER FIVE FEATURES OF DRIFT.
      #
      # `editor/` was the one directory this file did not mention, and the cost
      # was exactly what the header above predicts of an unwatched check: the
      # tree-sitter grammar was missing string literals (F9), `and`/`or` — it
      # still carried the REMOVED `&&`/`||` (ticket 44) — `var` (F8), `== name`
      # (45) and `where` (F2). Five shipped features the grammar had never
      # gained, in a repo where every compiler-facing gate was green.
      #
      # Worse, only ONE of the five was visible: `check-corpus.sh` aborted at its
      # first failing file, so it reported one problem and held four. Both the
      # abort and all five forms are fixed, which is what makes it safe to make
      # this required rather than aspirational.
      #
      # `check-tokens.sh` needs nothing. `check-corpus.sh` SKIPS WITH EXIT 0 when
      # the tree-sitter CLI is absent, so the CLI is installed on purpose: a
      # gate that silently skips is worse than one that is honestly missing,
      # which is the whole argument of this file.
      #
      # THE TWO INSTALL STEPS MOVED UP TO THE TOOLCHAIN BLOCK on 2026-08-26 and
      # the move is load-bearing rather than tidy. `check-toolchain.sh --env`
      # asks all four pinned tools what version they are, and it has to be able
      # to fail BEFORE anything compiles — which it cannot do if half the
      # toolchain arrives four hundred lines after the escript is built.
      #
      # BOTH SELF-TESTS ARE HERE RATHER THAN WITH THE CHEAP ONES because
      # `check-corpus.sh`'s controls run the Tree-sitter parser, and its
      # self-test FAILS rather than skips when the CLI is absent. The gate
      # itself still skips — that deviation is deliberate and recorded — but a
      # self-test that passes without running its controls asserts the one thing
      # it exists to disprove.
      #
      # `check-corpus.sh`'s second control found a hole rather than confirming
      # one: an empty corpus reported that every example parsed. See the commit.
      - name: The editor gates prove they can fail
        run: |
          ./editor/bin/check-tokens.sh --self-test
          ./editor/bin/check-corpus.sh --self-test

      - name: The editor grammars know every shipped keyword
        run: ./editor/bin/check-tokens.sh

      - name: The editor grammar parses every example
        run: ./editor/bin/check-corpus.sh

      # The exemplars are generated from ticket 25's write-ups, which are
      # canonical; this fails if the committed copies have drifted.
      #
      # Also excluded until 2026-08-15, and by then it had been fixed by someone
      # else — the write-ups were brought onto the unified dialect in an earlier
      # session and nothing came back to re-enable the gate. An exclusion that
      # outlives its reason is the same failure this file was written about.
      - name: Exemplars are not stale
        working-directory: compiler
        run: ./bin/extract-exemplars.sh --check

      # AND THE STEP ABOVE ONLY CHECKS ONE OF THE TWO WAYS THEY GO STALE.
      # `--check` proves the extracted files match the write-ups. Both can agree
      # perfectly and both describe a language the compiler no longer has —
      # which is what happened: 63 clause heads rotted in a dropped dialect, and
      # F13's binary patterns moved 25c's wall from `consume.bs:14` to `:20`
      # while the record kept saying 14 and twelve gates stayed green.
      #
      # ITS SELF-TEST IS HERE RATHER THAN WITH THE CHEAP ONES because all five
      # of its controls drive the real `bsc` over copies of the real exemplars,
      # so they cannot run before `escriptize`. The gate refuses rather than
      # skipping when the escript is missing, so reordering the steps cannot
      # quietly turn either one into a no-op.
      - name: The exemplar frontier gate proves it can fail
        run: ./compiler/bin/check-exemplar-frontier.sh --self-test

      - name: The exemplars stop where FRONTIER says they do
        run: ./compiler/bin/check-exemplar-frontier.sh

  # THE ENTRY POINT A CLEAN CLONE IS TOLD TO RUN, ACTUALLY RUN.
  #
  # `README.md` gives a recipient two commands — `mise install` and
  # `./bin/verify.sh` — and a documented command that nothing executes is the
  # same claim this whole file was written about. The job above proves the gates
  # pass; this one proves the SENTENCE IN THE README is true.
  #
  # It is not a duplicate of the job above in the way it looks. That one is
  # twenty-odd named steps, each with the reasoning for why the gate exists, and
  # a red there says which gate and why in one click. This one is a single
  # opaque command and a red says "stage 14". Both are worth having, and they
  # run in parallel, so the wall clock does not double even though the compute
  # does.
  #
  # THE INTENDED END STATE IS ONE JOB, and the deferred half is recorded here
  # rather than lost: collapse the job above into `./bin/verify.sh` once GitHub's
  # log grouping makes a stage inside a script as navigable as a step (or once
  # `verify.sh` emits `::group::` markers itself, which is the cheaper half).
  # What that needs: the per-gate reasoning moved from step comments into
  # `verify.sh`'s stage list without losing any of it — that prose is the most
  # valuable thing in this file — and a way to keep the toolchain steps, which
  # are `uses:` and cannot move into a script at all.
  clean-clone:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # THE SAME TOOLCHAIN AS THE JOB ABOVE, AND NOW LITERALLY SO. This block
      # used to repeat four version strings, and `check-toolchain.sh` earned its
      # keep by catching the case where one job was bumped and the other was
      # not. Both jobs now read `.tool-versions`, so the two cannot disagree —
      # there is nothing left here to disagree with.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          MISE_ERLANG_COMPILE: "false"
        with:
          version: 2026.8.14
          install: true
          cache: true

      # NO `working-directory:`, AND THAT IS THE POINT OF THE STEP. The entry
      # point anchors on its own location, so it is invoked from a path that is
      # not the repository root to prove it.
      - name: One command, from a clean clone
        run: "$GITHUB_WORKSPACE/bin/verify.sh"
        working-directory: /tmp

# NOTHING IS EXCLUDED FROM THIS WORKFLOW.
#
# There was a block here naming two scripts that failed on master, on the
# principle that an unlisted broken check is how the repo ended up with three
# verification scripts and no CI. Both are now steps above. Keep it that way: if
# a gate has to come out, it goes back in this block with the reason, and the
# reason gets re-checked rather than inherited.
#
# AND THE SENTENCE ABOVE WAS TRUE OF THE COMPILER AND FALSE OF THE REPO until
# 2026-08-17. `editor/bin/` held two gates this file had never mentioned — not
# excluded with a reason, simply never considered — and they accumulated five
# features' worth of drift while every gate named here stayed green. An
# unmentioned check is not outside the rule above; it is the rule's blind spot.
# A new verification script belongs in this file on the day it is written.
